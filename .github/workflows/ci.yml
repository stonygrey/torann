name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    name: .NET tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet test dotnet/Torann.slnx --logger "console;verbosity=detailed"

  swift:
    name: Swift tests (macOS and iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        run: swift test
      - name: iOS Simulator
        run: |
          xcodebuild test -scheme Torann-Package \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" | xcpretty || \
          xcodebuild test -scheme Torann-Package \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData"

  kotlin-jvm:
    name: Kotlin JVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: cd kotlin && ./gradlew :torann:test

  kotlin-android:
    name: Kotlin instrumented tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [33, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          script: cd kotlin && ./gradlew :android-tests:connectedCheck

  reactnative:
    name: React Native package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: lib/sync-reactnative-sources --check
      - run: cd reactnative/torann && npm ci && npm run lint && npm test && npm run build

  interop:
    name: Cross-implementation interop
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: python3 interop/run.py
