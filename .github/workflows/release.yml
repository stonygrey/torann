#
# Each publish step runs only when its secret exists and is a dry run otherwise:
#   NUGET_API_KEY                                   -> `dotnet nuget push`
#   MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD,
#   SIGNING_KEY, SIGNING_PASSWORD                   -> Maven Central publish with signing
#   NPM_TOKEN                                       -> `npm publish` of the React Native package
# The Flutter package is published to pub.dev by hand, after the Maven artifact it
# depends on is available. The Swift package has no publishing step because SwiftPM
# reads the pushed tag.

name: Release

on:
  push:
    tags: ['v*']

jobs:
  versions:
    name: Versions match the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: lib/check-versions "${GITHUB_REF_NAME#v}"

  nuget:
    name: NuGet
    needs: versions
    runs-on: ubuntu-latest
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet test dotnet/Torann.slnx
      - run: dotnet/lib/pack-nuget
      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: dotnet/artifacts/*.nupkg
      - name: Publish (dry run without NUGET_API_KEY)
        run: |
          if [ -n "$NUGET_API_KEY" ]; then dotnet/lib/publish-nuget; else echo "dry run: NUGET_API_KEY is not set; package built but not pushed"; fi

  maven:
    name: Maven Central
    needs: versions
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: cd kotlin && ./gradlew :torann:test :torann:publishToMavenLocal
      - uses: actions/upload-artifact@v4
        with:
          name: maven
          path: ~/.m2/repository/com/stonygrey/torann/
      - name: Publish (dry run without credentials)
        run: |
          cd kotlin
          if [ -n "$ORG_GRADLE_PROJECT_mavenCentralUsername" ] && [ -n "$ORG_GRADLE_PROJECT_signingInMemoryKey" ]; then
            ./gradlew :torann:publishToMavenCentral
          else
            echo "dry run: Maven Central credentials or signing key not set"
            ./gradlew :torann:publishToMavenCentral --dry-run
          fi

  flutter:
    name: pub.dev dry run
    needs: versions
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: lib/sync-flutter-sources --check
      - run: cd flutter/torann && flutter pub get && flutter analyze && flutter test
      - run: cd flutter/torann && flutter pub publish --dry-run

  npm:
    name: npm
    needs: versions
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: lib/sync-reactnative-sources --check
      - run: cd reactnative/torann && npm ci && npm test && npm run build
      - run: cd reactnative/torann && npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm
          path: reactnative/torann/*.tgz
      - name: Publish (dry run without NPM_TOKEN)
        run: |
          cd reactnative/torann
          if [ -n "$NODE_AUTH_TOKEN" ]; then npm publish --access public; else echo "dry run: NPM_TOKEN is not set; package built but not published"; npm publish --dry-run; fi

  swift:
    name: Swift package builds at the tag
    needs: versions
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c release
      - run: swift test
